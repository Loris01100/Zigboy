name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Sans `version`, l'action lit `minimum_zig_version` dans build.zig.zon :
      # la CI utilise donc toujours la même version de Zig qu'en local.
      - uses: mlugg/setup-zig@v2

      - name: Formatage
        run: zig fmt --check build.zig src tests

      # Les ROMs de Blargg ne sont pas versionnées (test-roms/ est ignoré).
      - name: ROMs de test
        run: git clone --depth 1 https://github.com/retrio/gb-test-roms test-roms/gb-test-roms

      - name: Tests
        run: zig build test -Drequire-test-roms --summary all
